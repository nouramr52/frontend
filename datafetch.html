<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Trending Movies</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #222;
            color: white;
        }

        .movie {
            background-color: #333;
            height: 100%;
        }

        .movie img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
        }

        .rating {
            background-color: orange;
            color: black;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

    </style>

</head>


<body>


    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Trending Movies 🎬
        </h1>


        <div id="movies" class="row g-4"></div>


    </div>



    <script>

        let movies = document.getElementById("movies");


        fetch("https://api.themoviedb.org/3/trending/movie/day", {

            headers: {

                "Authorization": "Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4YTZjZWQ1ZDY4NTVjYmY2ZjIxNWYxYmY0ZTkwYTAxZiIsIm5iZiI6MTc4ODI1NjY5MC44NTYsInN1YiI6IjZhOTZhMWIyYzkyZTMwNDMxZWJlYTFjYSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.Y6K9mkJ-tC86Rr7aJlsh0TR7KNPhfl77yM4C8JISX3s",

                "accept": "application/json"

            }

        })


        .then(response => response.json())


        .then(json => {

            console.log(json);


            for (let i = 0; i < 6; i++) {

                let movie = json.results[i];


                movies.innerHTML +=

                    "<div class='col-md-4'>" +

                        "<div class='movie p-2'>" +

                            "<img src='https://image.tmdb.org/t/p/w500" +
                            movie.poster_path +
                            "'>" +

                            "<div class='p-3'>" +

                                "<div class='movie-title'>" +
                                movie.title +
                                "</div>" +

                                "<p>" +
                                movie.overview.substring(0, 100) +
                                "..." +
                                "</p>" +

                                "<span class='rating'>" +
                                movie.vote_average.toFixed(1) +
                                "</span>" +

                            "</div>" +

                        "</div>" +

                    "</div>";

            }

        });


    </script>


</body>

</html>
