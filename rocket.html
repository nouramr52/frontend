<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Magic Fortune Button</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: white;
        }

        .rocket {
            position: fixed;
            bottom: 20px;
            right: 50%;
            font-size: 50px;
            display: none;
        }

        .fly {
            display: block;
            animation: flyUp 3s;
        }

        @keyframes flyUp {

            from {
                bottom: 20px;
            }

            to {
                bottom: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container mt-5">

        <h1>Magic Fortune Button 🚀</h1>

        <button id="button" class="btn btn-light border">
            Launch Rocket 🚀
        </button>

        <div id="rocket" class="rocket">
            🚀
        </div>

    </div>


    <script>

        let button = document.getElementById("button");

        let rocket = document.getElementById("rocket");


        button.addEventListener("click", function() {

            rocket.classList.add("fly");

        });

    </script>


</body>

</html>
